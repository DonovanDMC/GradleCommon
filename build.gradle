plugins {
    id 'groovy-gradle-plugin'
    id 'maven-publish'
    id 'com.gradle.plugin-publish' version '1.3.1'
}

gradlePlugin {
    website = 'https://github.com/DonovanDMC/GradleCommon'
    vcsUrl = 'https://github.com/DonovanDMC/GradleCommon'
    plugins.configureEach {
        displayName = 'GradleCommon MC Plugin'
        description = 'Common Gradle config for Minecraft projects'
        tags.add('minecraft')
    }
}

group = 'cool.furry.gradle'
version = findProperty('releaseVersion') ?: '1.0.0'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.groovy:groovy:5.0.0'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}